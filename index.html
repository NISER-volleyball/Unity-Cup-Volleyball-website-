<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Unity Cup 2026</title>
  <link rel="stylesheet" href="Volleyball Unity Cup.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="header-actions">
        <span class="admin-badge" id="adminBadge" hidden>Admin</span>
        <button type="button" class="login-btn" id="loginBtn">Login</button>
      </div>
      <div class="iris" aria-hidden="true"><span class="core"></span></div>
      <p class="eyebrow">Outdoor Volleyball</p>
      <h1>Volleyball Unity Cup 2026</h1>
      <p class="subhead">Two groups, one cup. Follow the standings, catch every match, and meet the teams.</p>
      <p class="data-status" id="dataStatus" role="status" hidden></p>
    </header>
    <nav class="tabs">
      <button class="tab active" data-tab="standings">Standings</button>
      <button class="tab" data-tab="matches">Matches</button>
      <button class="tab" data-tab="teams">Teams</button>
      <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
    </nav>
    <main>
      <section id="standings" class="panel">
        <div class="groups-grid"></div>
      </section>
      <section id="matches" class="panel hidden">
        <div class="fusion-overlay" id="fusionOverlay" aria-hidden="true">
          <div class="backdrop"></div>
          <span class="orb orb-blue"></span>
          <span class="orb orb-red"></span>
          <span class="shockwave"></span>
          <svg class="lightning-svg" aria-hidden="true"></svg>
          <span class="burst"></span>
        </div>
        <div class="add-row" id="addMatchRow" hidden>
          <button type="button" class="add-btn" id="addMatch">+ Add match</button>
        </div>
        <div class="matches-list" id="matchesList"></div>
      </section>
      <section id="teams" class="panel hidden">
        <div class="teams-grid"></div>
      </section>
    </main>
  </div>
  <footer class="site-footer">
    <p>Created by <span class="credit-name">Suryaditya Das</span><span class="credit-batch">B25</span></p>
  </footer>
  <div class="save-bar" id="saveBar" hidden>
    <span class="save-text" id="saveText">All changes are saved</span>
    <div class="save-actions">
      <button type="button" class="ghost-btn" id="discardBtn">Discard</button>
      <button type="button" class="primary-btn" id="saveBtn">Save changes</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="modal" id="loginModal" hidden>
    <div class="modal-backdrop" id="loginBackdrop"></div>
    <form class="modal-card" id="loginForm" role="dialog" aria-modal="true" aria-labelledby="loginTitle" autocomplete="off" novalidate>
      <p class="eyebrow">Organizer access</p>
      <h2 id="loginTitle">Log in</h2>
      <p class="modal-note">Log in to edit teams and results.</p>
      <label>Username<input type="text" id="loginUser" autocomplete="username"></label>
      <label>Password<input type="password" id="loginPass" autocomplete="current-password"></label>
      <p class="form-msg" id="loginError" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="loginCancel">Cancel</button>
        <button type="submit" class="primary-btn" id="loginSubmit">Log in</button>
      </div>
    </form>
  </div>
  <script src="Volleyball Unity Cup.js"></script>
</body>
</html>
